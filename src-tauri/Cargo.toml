[package]
name = "pos-desktop"
version = "0.1.0"
description = "POS desktop (Windows) - Tauri + React"
authors = ["emmar"]
edition = "2021"

[lib]
name = "pos_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

[dependencies]
tauri = { version = "=2.10.3", features = ["wry"] }
tauri-plugin-opener = "=2.5.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
tokio-stream = "0.1"
serialport = "4.3.0"
reqwest = { version = "0.11", features = ["json", "stream"] }
base64 = "0.22"
chrono = "0.4.44"
regex = "1"
